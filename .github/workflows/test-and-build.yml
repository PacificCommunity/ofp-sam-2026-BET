name: Model CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-model-changes:
    if: ${{ github.ref_name != '4R' && github.head_ref != '4R' }}
    runs-on: ubuntu-22.04
    outputs:
      model: ${{ steps.changes.outputs.model }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Detect model-related changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            model:
              - '**'
              - '!report/**'
              - '!README.md'
              - '!.github/**'
      
      - name: Summarize detected changes
        run: |
          echo "Model files changed: ${{ steps.changes.outputs.model }}"

  test-model:
    runs-on: ubuntu-22.04
    needs: detect-model-changes
    if: ${{ github.ref_name != '4R' && github.head_ref != '4R' && needs.detect-model-changes.outputs.model == 'true' }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Run model workflow
      run: make docker-run
      timeout-minutes: 60
    
    - name: Upload model artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mfcl-outputs-${{ github.sha }}
        path: |
          model/
        retention-days: 30
    
